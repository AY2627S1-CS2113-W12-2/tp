-size="14" textLength="29.545" font-weight="700">loop</text><text x="431.903" y="438.236" fill="#000" font-size="14" textLength="387.427" font-weight="700">[for each lesson, in the order typed, while money remains]</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg8" data-source-line="31"><polygon points="664.167,473.531,674.167,477.531,664.167,481.531,668.167,477.531" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="363.358" y1="477.531" x2="670.167" y2="477.531" style="stroke:#181818;stroke-width:1;"/><text x="370.358" y="472.455" fill="#000" font-size="14" textLength="293.809">updateLessonAmountPaid(id, paid + allocation)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg9" data-source-line="33"><polygon points="374.358,505.141,364.358,509.141,374.358,513.141,370.358,509.141" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="368.358" y1="509.141" x2="675.167" y2="509.141" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="380.358" y="504.064" fill="#000" font-size="14" textLength="94.965">updated lesson</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg10" data-source-line="36"><polygon points="21,550.75,11,554.75,21,558.75,17,554.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="15" y1="554.75" x2="352.358" y2="554.75" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="27" y="549.674" fill="#000" font-size="14" textLength="324.358">"Recorded payment of $90.00 for 2 lessons: L1, L2."</text></g><path d="M296.247,567.75 L296.247,612.75 L743.247,612.75 L743.247,577.75 L733.247,567.75 L296.247,567.75" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M733.247,567.75 L733.247,577.75 L743.247,577.75 L733.247,567.75" style="stroke:#181818;stroke-width:0.5;"